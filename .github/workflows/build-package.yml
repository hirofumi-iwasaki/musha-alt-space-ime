name: Build and package

on:
  push:
    branches: [release/0.1.0]
  pull_request:
    branches: [release/0.1.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MushaAltSpaceIme.slnx

      - name: Test and build package
        shell: pwsh
        run: ./tool/build-package.ps1 -Configuration Release -OutputDirectory artifacts

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v7
        with:
          name: musha-alt-space-ime-windows-x64
          path: |
            artifacts/musha-alt-space-ime-windows-x64.zip
            artifacts/musha-alt-space-ime-windows-x64.zip.sha256
          if-no-files-found: error
